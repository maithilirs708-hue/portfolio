<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Contact Maithili R S through the accessible contact form.">

    <meta name="author" content="Maithili R S">

    <title>Contact | Maithili R S</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">

        <div class="header-container">

            <div class="brand">
                <h1>Contact Me</h1>
            </div>

            <div class="theme-control">
                <input type="checkbox" id="theme-toggle">
                <label for="theme-toggle">Dark Mode</label>
            </div>

        </div>

        <nav class="main-nav" aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="about.html">About</a>
                </li>

                <li>
                    <a href="projects.html">Projects</a>
                </li>

                <li>
                    <a href="contact.html" aria-current="page">Contact</a>
                </li>
            </ul>
        </nav>

    </header>

    <main id="main-content" class="container">

        <section class="contact-section" aria-labelledby="contact-heading">

            <h2 id="contact-heading">Get in Touch</h2>

            <p>
                If you would like to contact me, please use the form below.
            </p>

            <form aria-labelledby="contact-heading">

                <fieldset>

                    <legend>Contact Information</legend>

                    <div class="form-grid">

                        <p>
                            <label for="name">Full Name:</label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                autocomplete="name"
                                required>
                        </p>

                        <p>
                            <label for="email">Email Address:</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required>
                        </p>

                        <p>
                            <label for="subject">Subject:</label>

                            <input
                                type="text"
                                id="subject"
                                name="subject"
                                required>
                        </p>

                        <p class="full-width">

                            <label for="message">Message:</label>

                            <textarea
                                id="message"
                                name="message"
                                rows="6"
                                required></textarea>

                        </p>

                    </div>

                    <button type="submit">Send Message</button>

                </fieldset>

            </form>

        </section>

    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Maithili R S. All rights reserved.</p>
    </footer>

</body>

</html>
